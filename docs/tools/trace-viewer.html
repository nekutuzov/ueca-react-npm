ts go, and the head goes to what you clicked.",SE="<b>Beat</b><br>The shortest time any two events will be shown apart.<br> An application works in bursts: forty events inside two hundred microseconds, then nothing for fifteen milliseconds. Slowing that down evenly does not help — the burst is still one flash and the silence is now fifteen <i>seconds</i> of nothing. So every event gets the beat, a gap adds a rest in proportion to how long it was, and a stretch of quiet costs one rest however long it ran — the same stretches the strip above closes up. Glows last about as long as the beat, so what is still fading is the two or three events before this one and nothing older.<br> <span class='k'>real</span> takes that floor away: two events fire as close together as they happened, so a cascade reads as a cascade — and a trace whose work spans half a second is over before you have seen it. What stays is the <i>ceiling</i>. A gap costs a quarter of a second at most, whether it held nothing at all or held records your filter took out, because a stretch the strip above has closed up is not one to sit through.",OE="<b>Show every kind</b><br>Switches all the chips on. The text and the components are left alone.",TE="<b>Hide every kind</b><br>Switches all the chips off, to turn back on the one or two worth looking at.",EE="<b>On screen only</b><br>Draws the application as it stands where the head is standing, rather than as the whole recording has ever known it. A component goes when its <span class='k'>deinit</span> passes and comes back when an <span class='k'>init</span> does — so in an application that switches screens the picture holds the one screen that exists instead of every screen ever visited.<br> An owner stays for as long as anything under it is drawn, and a component whose life the recording says nothing about is always drawn: no <span class='k'>init</span> in the capture is not evidence that something has gone.<br> Changes the <b>Graph</b> and the <b>Tree</b>. A
